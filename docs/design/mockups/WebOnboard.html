<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页 · 前台入职</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04A17}a:hover{color:#8E3A10}
.catmask{-webkit-mask-image:url(../../../src/assets/photo/sample-cat.webp);mask-image:url(../../../src/assets/photo/sample-cat.webp);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; background: #F7F3EE; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #231C17; display: flex; flex-direction: column">
  <header style="min-height: 64px; box-sizing: border-box; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; border-bottom: 1px solid #E6DED5">
    <a href="WebLobby.html" style="display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; color: #231C17; flex: 1">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">purr.si</span>
      <span style="font-size: 13px; font-weight: 500; color: #6E6259">前台</span>
    </a>
    <a href="WebLobby.html" style="height: 44px; line-height: 44px; padding: 0 8px; font-size: 14px; font-weight: 700">先不入职，回大厅</a>
  </header>

  <main style="width: 100%; max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: 40px 32px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700; color: #B04A17">新猫入职 · 第 2 步，共 3 步</span>
      <h1 style="margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -0.01em">欢迎新同事，点一下你的猫</h1>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <div style="flex: 999 1 560px; min-width: 0; height: 620px; position: relative; overflow: hidden; border-radius: 24px; background: #3B2E25">
        <img src="../../../src/assets/photo/bg.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
        <img src="../../../src/assets/photo/sample-cat.webp" alt="你上传的猫咪照片" style="position: absolute; left: 50%; top: 50%; width: 480px; height: 480px; transform: translate(-50%, -50%)">
        <div class="catmask" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 480px; height: 480px; transform: translate(-50%, -50%); background: #2E6F62; opacity: 0.45"></div>
        <div aria-hidden="true" style="position: absolute; left: calc(50% - 18px); top: calc(50% - 38px); width: 36px; height: 36px; border-radius: 50%; border: 3px solid #FFFFFF; box-sizing: border-box"></div>
        <div aria-hidden="true" style="position: absolute; left: calc(50% - 9px); top: calc(50% - 29px); width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></div>
        <span style="position: absolute; left: 20px; bottom: 20px; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); color: #FFFFFF; font-size: 13px; font-weight: 700">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #7FD1B9"></span>抠好了，绿色的就是你的猫</span>
        <span style="position: absolute; right: 20px; bottom: 20px; display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); color: #FFFFFF; font-size: 13px">照片只在你的浏览器里处理，GPS 信息已抹掉</span>
      </div>

      <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 20px">
        <ol aria-label="入职进度" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
          <li style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #DCEDE8; color: #2E6F62">
            <span style="width: 28px; height: 28px; border-radius: 50%; background: #2E6F62; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
            <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">上传照片</span><span style="font-size: 12px">最好是从上往下拍、趴着或睡着的样子</span></span></li>
          <li aria-current="step" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #B04A17">
            <span style="display: flex; align-items: center; gap: 12px">
              <span style="width: 28px; height: 28px; border-radius: 50%; background: #B04A17; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600">2</span>
              <span style="font-size: 15px; font-weight: 700">点一下猫，前台帮你抠出来</span></span>
            <span style="font-size: 14px; line-height: 1.6; color: #6E6259">漏了尾巴或耳朵？在那里再点一下补上。只收猫猫哦，上线前前台会检查照片。</span>
            <span style="display: flex; gap: 10px; flex-wrap: wrap">
              <button type="button" style="height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: #B04A17; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">就是它，下一步</button>
              <button type="button" style="height: 48px; padding: 0 18px; border: 1.5px solid #CFC4B8; border-radius: 999px; background: #FFFFFF; color: #231C17; font-family: inherit; font-size: 15px; font-weight: 700">重新点</button>
              <button type="button" style="height: 48px; padding: 0 18px; border: 1.5px solid #CFC4B8; border-radius: 999px; background: #FFFFFF; color: #231C17; font-family: inherit; font-size: 15px; font-weight: 700">换照片</button>
            </span></li>
          <li style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6DED5; color: #6E6259">
            <span style="display: flex; align-items: center; gap: 12px">
              <span style="width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #CFC4B8; display: inline-flex; align-items: center; justify-content: center; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; box-sizing: border-box">3</span>
              <span style="font-size: 15px; font-weight: 700">起名字、领工牌</span></span>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px">猫的名字
              <input type="text" value="mochi" disabled style="height: 44px; padding: 0 12px; border: 1px solid #E6DED5; border-radius: 12px; background: #F7F3EE; color: #6E6259; font-family: inherit; font-size: 15px">
            </label>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="font-family: 'IBM Plex Mono', monospace; color: #231C17">purr.si/mochi</span><span style="color: #2E6F62; font-weight: 700">可以用</span></span></li>
        </ol>
        <span style="font-size: 12px; color: #6E6259">入职需要登录。照片里的猫必须是你自己的猫。</span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
