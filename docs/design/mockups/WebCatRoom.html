<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页 · 猫房 mochi</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04A17}a:hover{color:#8E3A10}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; background: #F7F3EE; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #231C17; display: flex; flex-direction: column">
  <header style="min-height: 64px; box-sizing: border-box; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; border-bottom: 1px solid #E6DED5">
    <a href="WebLobby.html" style="display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; color: #231C17; flex: 1">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">purr.si</span>
      <span style="font-size: 13px; font-weight: 500; color: #6E6259">撸猫馆</span>
    </a>
    <a href="WebLobby.html" style="height: 44px; line-height: 44px; padding: 0 8px; font-size: 14px; font-weight: 700">逛逛大厅</a>
    <a href="WebOnboard.html" style="height: 44px; line-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #231C17; color: #231C17; font-size: 14px; font-weight: 700; text-decoration: none; box-sizing: border-box">送你家猫来上班</a>
  </header>

  <main style="display: flex; flex-wrap: wrap; flex: 1">
    <section aria-label="撸 mochi" style="flex: 999 1 640px; min-width: 0; height: 836px; position: relative; overflow: hidden; background: #3B2E25; color: #FFFFFF">
      <img src="../../../src/assets/photo/bg.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
      <img src="../../../src/assets/photo/sample-cat.webp" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 500px; transform: translate(calc(-50% + 10px), calc(-50% + 12px)); filter: brightness(0) blur(16px); opacity: 0.35">
      <img src="../../../src/assets/photo/sample-cat.webp" alt="mochi，一只蜷着睡觉的灰色虎斑猫" style="position: absolute; left: 50%; top: 50%; width: 500px; transform: translate(-50%, -50%)">

      <img src="../../../src/assets/photo/arm.webp" alt="" aria-hidden="true" style="position: absolute; left: calc(50% - 300px); top: calc(50% - 70px); width: 280px; transform: scaleX(-1) rotate(-26deg); transform-origin: 50% 100%; opacity: 0.38">
      <span style="position: absolute; left: calc(50% - 330px); top: calc(50% - 118px); display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); font-size: 12px; font-weight: 500"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">BR</span>圣保罗的客人</span>

      <img src="../../../src/assets/photo/arm.webp" alt="" aria-hidden="true" style="position: absolute; left: calc(50% + 34px); top: calc(50% - 2px); width: 290px; transform: rotate(-16deg); transform-origin: 50% 100%; filter: brightness(0) blur(10px); opacity: 0.38">
      <img src="../../../src/assets/photo/arm.webp" alt="你的手，正在撸 mochi" style="position: absolute; left: calc(50% + 20px); top: calc(50% - 8px); width: 290px; transform: rotate(-16deg); transform-origin: 50% 100%">

      <div style="position: absolute; left: 24px; top: 24px; display: flex; gap: 8px; flex-wrap: wrap">
        <span style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7FD1B9"></span>mochi 在岗 · 东京下午 3 点</span>
        <span style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); font-size: 13px; font-weight: 500">此刻 23 只手在撸</span>
      </div>
      <button type="button" aria-label="静音" style="position: absolute; right: 24px; top: 24px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg></button>

      <div role="status" style="position: absolute; left: 50%; top: 92px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: #FFFFFF; color: #231C17; font-size: 14px; font-weight: 700; white-space: nowrap">
        <span style="width: 22px; height: 22px; border-radius: 50%; background: #DCEDE8; color: #2E6F62; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
        找到了！mochi 最爱被摸下巴</div>

      <div style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); width: 380px; height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); display: flex; align-items: center; gap: 12px">
        <span style="font-size: 13px; font-weight: 700; flex: none">呼噜中</span>
        <span style="flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.22); overflow: hidden"><span style="display: block; width: 62%; height: 100%; border-radius: 999px; background: #E8833A"></span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; flex: none">62%</span>
      </div>
    </section>

    <aside style="flex: 1 1 380px; max-width: 100%; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6DED5; display: flex; gap: 14px; align-items: center">
        <span style="width: 72px; height: 72px; border-radius: 50%; overflow: hidden; border: 3px solid #C9962E; flex: none"><img src="../../../src/assets/photo/sample-cat.webp" alt="mochi 的头像" style="width: 180%; margin: -10% 0 0 -10%"></span>
        <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px"><h1 style="margin: 0; font-size: 24px; font-weight: 900">mochi</h1><span style="padding: 2px 8px; border-radius: 999px; background: #F3E6C8; color: #7A5A12; font-size: 11px; font-weight: 700">正式馆猫</span></div>
          <span style="font-size: 13px; color: #6E6259">JP · 东京 · 上班 128 天 · 12,480 位客人</span>
          <span style="display: flex; gap: 6px; margin-top: 2px"><span style="padding: 3px 9px; border-radius: 999px; background: #F6E3D6; color: #8E3A10; font-size: 12px; font-weight: 700">粘人</span><span style="padding: 3px 9px; border-radius: 999px; background: #F6E3D6; color: #8E3A10; font-size: 12px; font-weight: 700">贪吃</span></span>
        </div>
      </div>

      <section style="padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6DED5; display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 900">给 mochi 加个餐</h2>
        <div role="radiogroup" aria-label="选择零食" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <button type="button" role="radio" aria-checked="true" style="height: 76px; border: 2px solid #B04A17; border-radius: 14px; background: #F6E3D6; font-family: inherit; color: #231C17; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 700">小鱼干</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8E3A10">10 罐</span></button>
          <button type="button" role="radio" aria-checked="false" style="height: 76px; border: 1.5px solid #E6DED5; border-radius: 14px; background: #FFFFFF; font-family: inherit; color: #231C17; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 700">罐头</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6E6259">50 罐</span></button>
          <button type="button" role="radio" aria-checked="false" style="height: 76px; border: 1.5px solid #E6DED5; border-radius: 14px; background: #FFFFFF; font-family: inherit; color: #231C17; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 700">猫条</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6E6259">100 罐</span></button>
        </div>
        <button type="button" style="height: 50px; border: 0; border-radius: 999px; background: #B04A17; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">喂小鱼干 · 10 罐</button>
        <span style="font-size: 12px; color: #6E6259; text-align: center">要先办张入馆卡，新客人送 30 罐罐</span>
      </section>

      <a href="#" style="padding: 16px 18px; border-radius: 18px; background: #231C17; color: #F7F3EE; display: flex; align-items: center; gap: 12px; text-decoration: none">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8833A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 15px; font-weight: 700">进 mochi 的包间</span><span style="font-size: 12px; color: #CFC4B8">看它翻肚皮、听真猫呼噜、每周新照片</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #E8833A">$1.99/月</span>
      </a>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 14px; font-weight: 700">mochi 的挚友墙 · 86 位</span>
        <div style="display: flex">
          <span style="width: 34px; height: 34px; border-radius: 50%; background: #F6E3D6; color: #8E3A10; border: 2px solid #F7F3EE; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">L</span>
          <span style="width: 34px; height: 34px; border-radius: 50%; background: #DCEDE8; color: #2E6F62; border: 2px solid #F7F3EE; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-left: -8px">A</span>
          <span style="width: 34px; height: 34px; border-radius: 50%; background: #E6DED5; color: #6E6259; border: 2px solid #F7F3EE; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-left: -8px">悠</span>
          <span style="width: 34px; height: 34px; border-radius: 50%; background: #F3E6C8; color: #7A5A12; border: 2px solid #F7F3EE; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-left: -8px">M</span>
          <span style="height: 34px; line-height: 34px; padding: 0 10px; margin-left: 6px; font-size: 13px; color: #6E6259">来 30 天就能上墙</span>
        </div>
      </div>

      <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center">
        <button type="button" style="height: 44px; padding: 0 16px; border: 1.5px solid #CFC4B8; border-radius: 999px; background: #FFFFFF; color: #231C17; font-family: inherit; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"></path></svg>分享 mochi</button>
        <a href="#" style="font-size: 13px; color: #6E6259">举报 · 隐藏这只猫</a>
      </div>
    </aside>
  </main>
</div>
</x-dc>

</body>
</html>
