<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>前台 · 新猫入职</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04A17}a:hover{color:#8E3A10}
.catmask{-webkit-mask-image:url(../../../src/assets/photo/sample-cat.webp);mask-image:url(../../../src/assets/photo/sample-cat.webp);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 28px; background: #F7F3EE; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #231C17; display: flex; flex-direction: column; gap: 18px">
  <header style="display: flex; align-items: center; gap: 12px">
    <a href="Lobby.html" aria-label="返回大厅" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E6DED5; color: #231C17; display: inline-flex; align-items: center; justify-content: center; flex: none; box-sizing: border-box">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 12px; font-weight: 700; color: #B04A17">前台</span>
      <h1 style="margin: 0; font-size: 22px; font-weight: 900; line-height: 1.2">欢迎新同事</h1>
    </div>
  </header>

  <ol aria-label="入职进度" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <li style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: 12px; background: #DCEDE8; color: #2E6F62; font-size: 13px; font-weight: 700">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: #2E6F62; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>拍照</li>
    <li aria-current="step" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: 12px; background: #FFFFFF; border: 2px solid #B04A17; color: #231C17; font-size: 13px; font-weight: 700; box-sizing: border-box">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: #B04A17; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px">2</span>点一下猫</li>
    <li style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E6DED5; color: #6E6259; font-size: 13px; font-weight: 500; box-sizing: border-box">
      <span style="width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #CFC4B8; display: inline-flex; align-items: center; justify-content: center; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; box-sizing: border-box">3</span>起名字</li>
  </ol>

  <div style="position: relative; height: 380px; border-radius: 20px; overflow: hidden; background: #3B2E25">
    <img src="../../../src/assets/photo/bg.webp" alt="" style="position: absolute; left: -160px; top: -120px; width: 680px; height: 680px">
    <img src="../../../src/assets/photo/sample-cat.webp" alt="你上传的猫咪照片" style="position: absolute; left: 34px; top: 40px; width: 290px; height: 290px">
    <div class="catmask" aria-hidden="true" style="position: absolute; left: 34px; top: 40px; width: 290px; height: 290px; background: #2E6F62; opacity: 0.45"></div>
    <div aria-hidden="true" style="position: absolute; left: 164px; top: 156px; width: 32px; height: 32px; border-radius: 50%; border: 3px solid #FFFFFF; box-sizing: border-box"></div>
    <div aria-hidden="true" style="position: absolute; left: 172px; top: 164px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></div>
    <span style="position: absolute; left: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(28,22,18,0.62); backdrop-filter: blur(12px); color: #FFFFFF; font-size: 12px; font-weight: 700">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #7FD1B9"></span>抠好了，绿色的就是 mochi</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <p style="margin: 0; font-size: 16px; font-weight: 700">点一下你的猫，前台帮你把它抠出来</p>
    <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #6E6259">漏了尾巴或耳朵？再点一下那里补上。只收猫猫哦，上线前前台会检查照片。</p>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 54px; border: 0; border-radius: 999px; background: #B04A17; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">就是它，下一步</button>
    <div style="display: flex; gap: 10px">
      <button type="button" style="flex: 1; height: 48px; border: 1.5px solid #CFC4B8; border-radius: 999px; background: #FFFFFF; color: #231C17; font-family: inherit; font-size: 15px; font-weight: 700">再点一下补一块</button>
      <button type="button" style="flex: 1; height: 48px; border: 1.5px solid #CFC4B8; border-radius: 999px; background: #FFFFFF; color: #231C17; font-family: inherit; font-size: 15px; font-weight: 700">换一张照片</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
