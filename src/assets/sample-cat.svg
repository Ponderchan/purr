      <!-- Mackerel tabby stripes curving naturally over ribs and haunches -->
      <path d="M 465 224 C 492 292, 514 378, 492 462 C 472 385, 456 305, 434 242 Z" fill="#ad5524" opacity="0.46" />
      <path d="M 552 192 C 588 272, 616 392, 592 508 C 566 402, 542 298, 514 206 Z" fill="#ad5524" opacity="0.5" />
      <path d="M 648 176 C 692 268, 720 404, 688 548 C 660 416, 636 296, 606 184 Z" fill="#a85020" opacity="0.52" />
      <path d="M 748 182 C 796 276, 824 415, 788 564 C 762 430, 738 308, 706 188 Z" fill="#a85020" opacity="0.5" />
      <path d="M 848 208 C 896 302, 920 434, 882 572 C 858 446, 838 332, 804 218 Z" fill="#ad5524" opacity="0.46" />
      <path d="M 935 262 C 974 348, 992 458, 956 568 C 940 468, 922 372, 894 278 Z" fill="#ad5524" opacity="0.42" />

      <!-- Secondary softer side swirls for organic fur depth -->
      <path d="M 518 478 C 556 534, 560 618, 526 672" stroke="#ab5627" stroke-width="18" stroke-linecap="round" opacity="0.28" />
      <path d="M 632 512 C 668 574, 668 656, 632 712" stroke="#ab5627" stroke-width="20" stroke-linecap="round" opacity="0.28" />
      <path d="M 746 520 C 782 582, 778 662, 736 716" stroke="#ab5627" stroke-width="20" stroke-linecap="round" opacity="0.26" />
      <path d="M 852 512 C 882 574, 876 648, 834 698" stroke="#ab5627" stroke-width="18" stroke-linecap="round" opacity="0.24" />

      <!-- Soft cream flank highlight -->
      <path
        d="M 412 578 C 508 648, 672 678, 816 646 C 728 696, 540 698, 412 632 Z"
        fill="#fae0bf"
        opacity="0.34"
      />

