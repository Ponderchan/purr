      d="M 332 325 C 405 215, 575 162, 742 182 C 912 202, 1052 315, 1058 468 C 1063 592, 982 695, 830 722 C 685 748, 505 718, 396 655 C 318 610, 290 520, 305 422 C 311 384, 318 346, 332 325 Z"
