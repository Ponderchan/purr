      <ellipse cx="352" cy="512" rx="68" ry="52" fill="url(#creamFur)" opacity="0.92" />
      <ellipse cx="313" cy="542" rx="54" ry="38" fill="#fdf1e1" opacity="0.95" />

      <!-- Soft rosy sleeping cheek blush -->
      <ellipse cx="222" cy="482" rx="28" ry="16" fill="#df7b63" opacity="0.24" />
      <ellipse cx="404" cy="482" rx="28" ry="16" fill="#df7b63" opacity="0.24" />
    </g>

    <!-- Soft head outline -->
    <path
      d="M 316 286 C 406 284, 476 344, 478 428 C 480 492, 444 544, 386 566 C 344 582, 278 584, 232 564 C 176 540, 144 486, 148 422 C 152 340, 224 288, 316 286 Z"
      stroke="#9f5126"
      stroke-width="4"
      stroke-opacity="0.26"
    />

    <!-- Peaceful closed sleeping eyes -->
    <path
      d="M 222 436 C 234 456, 266 456, 280 436"
      stroke="#5c3522"
      stroke-width="7.5"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 218 440 L 210 434"
      stroke="#5c3522"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <path
      d="M 346 436 C 360 456, 392 456, 404 436"
      stroke="#5c3522"
      stroke-width="7.5"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 408 440 L 416 434"
      stroke="#5c3522"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- Cute coral-terracotta nose -->
    <path
      d="M 296 474 C 296 468, 330 468, 330 474 C 330 484, 319 494, 313 494 C 307 494, 296 484, 296 474 Z"
      fill="#cf6e5c"
    />
    <ellipse cx="309" cy="476" rx="7" ry="3.5" fill="#efb4a8" opacity="0.65" />

    <!-- Peaceful gentle smile -->
    <path
      d="M 313 494 L 313 505 M 288 510 C 295 520, 307 518, 313 506 C 319 518, 331 520, 338 510"
      stroke="#6e412b"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Neat soft whiskers -->
    <g stroke="#8a593d" stroke-width="3.5" stroke-linecap="round" opacity="0.52">
      <path d="M 212 496 Q 170 492 138 486" />
      <path d="M 210 512 Q 168 516 136 522" />
      <path d="M 414 496 Q 456 492 488 486" />
      <path d="M 416 512 Q 458 516 490 522" />
    </g>
  </g>
</svg>
