      <g stroke="#fce4c4" stroke-width="4.5" stroke-linecap="round" opacity="0.48">
        <path d="M 498 286 Q 530 272 564 276" />
        <path d="M 594 258 Q 634 246 674 252" />
        <path d="M 702 256 Q 742 250 780 264" />
        <path d="M 804 282 Q 842 284 876 304" />
        <path d="M 526 364 Q 564 352 602 362" />
        <path d="M 636 350 Q 678 342 718 354" />
        <path d="M 746 358 Q 788 356 826 374" />
        <path d="M 856 382 Q 892 388 924 412" />
        <path d="M 548 446 Q 588 438 628 450" />
        <path d="M 664 442 Q 706 438 746 452" />
        <path d="M 778 452 Q 818 456 854 474" />
        <path d="M 488 526 Q 532 528 572 544" />
        <path d="M 612 536 Q 656 540 698 552" />
        <path d="M 732 546 Q 774 552 814 562" />
      </g>
      <g stroke="#b25928" stroke-width="4" stroke-linecap="round" opacity="0.28">
        <path d="M 512 318 Q 546 306 582 312" />
        <path d="M 622 302 Q 662 294 700 304" />
        <path d="M 732 310 Q 772 308 808 324" />
        <path d="M 564 404 Q 604 396 642 408" />
        <path d="M 684 402 Q 726 398 764 414" />
        <path d="M 804 422 Q 842 426 878 444" />
        <path d="M 588 492 Q 628 492 668 506" />
        <path d="M 712 498 Q 752 502 790 516" />
        <path d="M 888 476 Q 922 492 948 520" />
      </g>
    </g>

    <!-- Gentle outer coat contour -->
