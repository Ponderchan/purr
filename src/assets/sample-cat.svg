      <!-- Forehead soft cream highlight -->
      <ellipse cx="314" cy="378" rx="110" ry="74" fill="#fce4c6" opacity="0.34" />

      <!-- Classic tabby M forehead stripes -->
      <path d="M 314 294 L 314 366" stroke="#aa5425" stroke-width="11" stroke-linecap="round" opacity="0.48" />
      <path d="M 284 298 C 282 328, 286 356, 296 374" stroke="#aa5425" stroke-width="10" stroke-linecap="round" opacity="0.46" />
      <path d="M 344 298 C 346 328, 342 356, 332 374" stroke="#aa5425" stroke-width="10" stroke-linecap="round" opacity="0.46" />
      <path d="M 248 318 C 254 342, 264 364, 276 378" stroke="#aa5425" stroke-width="8" stroke-linecap="round" opacity="0.36" />
      <path d="M 380 318 C 374 342, 364 364, 352 378" stroke="#aa5425" stroke-width="8" stroke-linecap="round" opacity="0.36" />

      <!-- Side cheek tabby accents -->
      <path d="M 152 414 Q 186 418 210 430" stroke="#aa5425" stroke-width="9" stroke-linecap="round" opacity="0.36" />
      <path d="M 156 446 Q 188 446 212 454" stroke="#aa5425" stroke-width="8" stroke-linecap="round" opacity="0.32" />
      <path d="M 476 414 Q 442 418 418 430" stroke="#aa5425" stroke-width="9" stroke-linecap="round" opacity="0.36" />
      <path d="M 472 446 Q 440 446 416 454" stroke="#aa5425" stroke-width="8" stroke-linecap="round" opacity="0.32" />

      <!-- Cream cheeks & chin -->
