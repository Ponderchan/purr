    <clipPath id="headClip">
      <path d="M 316 286 C 406 284, 476 344, 478 428 C 480 492, 444 544, 386 566 C 344 582, 278 584, 232 564 C 176 540, 144 486, 148 422 C 152 340, 224 288, 316 286 Z" />
