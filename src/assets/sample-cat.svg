<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" fill="none">
  <defs>
    <!-- Body base fur gradient -->
    <radialGradient id="bodyFur" cx="48%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#f5c690" />
      <stop offset="52%" stop-color="#e3995b" />
      <stop offset="86%" stop-color="#cc793e" />
      <stop offset="100%" stop-color="#b76530" />
    </radialGradient>

    <!-- Dorsal warm light highlight -->
    <radialGradient id="backHighlight" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#fce0ba" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#f4c28a" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#e3995b" stop-opacity="0" />
    </radialGradient>

    <!-- Head fur gradient -->
    <radialGradient id="headFur" cx="48%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#f7cc98" />
      <stop offset="55%" stop-color="#e59c5f" />
      <stop offset="90%" stop-color="#cb783e" />
      <stop offset="100%" stop-color="#ba6832" />
    </radialGradient>

    <!-- Tail fur gradient -->
    <linearGradient id="tailFur" x1="100%" y1="30%" x2="5%" y2="85%">
      <stop offset="0%" stop-color="#d48347" />
      <stop offset="45%" stop-color="#e49b5e" />
      <stop offset="82%" stop-color="#efc08d" />
      <stop offset="100%" stop-color="#fae6cd" />
    </linearGradient>

    <!-- Inner ear soft peach -->
    <linearGradient id="innerEar" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d88978" />
      <stop offset="100%" stop-color="#f1bdb0" />
    </linearGradient>

    <!-- Cream muzzle & paw fur -->
    <radialGradient id="creamFur" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fff3e2" />
      <stop offset="72%" stop-color="#f7dfc1" />
      <stop offset="100%" stop-color="#e8c298" />
    </radialGradient>

    <!-- Clip paths for crisp tabby markings -->
    <clipPath id="bodyClip">
      <path d="M 332 325 C 405 215, 575 162, 742 182 C 912 202, 1052 315, 1058 468 C 1063 592, 982 695, 830 722 C 685 748, 505 718, 396 655 C 318 610, 290 520, 305 422 C 311 384, 318 346, 332 325 Z" />
    </clipPath>

    <clipPath id="tailClip">
      <path d="M 968 548 C 1032 585, 1044 684, 962 746 C 864 818, 636 822, 465 760 C 408 739, 360 704, 366 664 C 372 628, 418 624, 464 648 C 588 712, 782 722, 885 674 C 930 653, 940 606, 916 576 Z" />
