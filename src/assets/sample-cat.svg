      d="M 968 548 C 1032 585, 1044 684, 962 746 C 864 818, 636 822, 465 760 C 408 739, 360 704, 366 664 C 372 628, 418 624, 464 648 C 588 712, 782 722, 885 674 C 930 653, 940 606, 916 576"
      stroke="#9f5126"
      stroke-width="4"
      stroke-opacity="0.26"
      stroke-linecap="round"
    />
  </g>

