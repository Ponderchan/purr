      <path d="M 884 656 C 910 698, 918 756, 892 794" stroke="#a65224" stroke-width="28" stroke-linecap="round" opacity="0.48" />
      <path d="M 780 694 C 794 742, 792 796, 766 826" stroke="#a65224" stroke-width="28" stroke-linecap="round" opacity="0.46" />
      <path d="M 668 696 C 672 744, 662 794, 636 820" stroke="#a65224" stroke-width="26" stroke-linecap="round" opacity="0.42" />
      <path d="M 558 674 C 556 720, 540 766, 514 788" stroke="#a65224" stroke-width="24" stroke-linecap="round" opacity="0.36" />

